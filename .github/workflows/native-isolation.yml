name: Native Linux isolation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Codex 0.154.0 / native Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare distro bubblewrap and its targeted AppArmor prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          command -v bwrap
          bwrap --version
          restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          printf 'apparmor_restrict_unprivileged_userns=%s\n' "${restriction:-unavailable}"
          namespace_probe() {
            bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --proc /proc --dev /dev /usr/bin/true
          }
          if namespace_probe; then
            echo 'Distro bubblewrap can create namespaces; no profile change needed.'
          else
            if [[ "$restriction" != 1 ]]; then
              echo 'Namespace setup failed without the documented AppArmor restriction; blocked.' >&2
              exit 1
            fi
            profile=/etc/apparmor.d/bwrap-userns-restrict
            if [[ ! -f "$profile" ]]; then
              packaged_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
              if [[ ! -f "$packaged_profile" ]]; then
                echo 'Required distro bubblewrap AppArmor profile is unavailable; blocked.' >&2
                exit 1
              fi
              sudo install -m 0644 "$packaged_profile" "$profile"
            fi
            sudo apparmor_parser -r "$profile"
            sudo grep -E '^bwrap([[:space:]]|//)' /sys/kernel/security/apparmor/profiles
            echo 'Loaded the packaged bubblewrap AppArmor profile for this disposable runner.'
            namespace_probe
          fi
          restriction_after="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          printf 'apparmor_restrict_unprivileged_userns_after=%s\n' "${restriction_after:-unavailable}"
          if [[ "$restriction_after" != "$restriction" ]]; then
            echo 'The system-wide AppArmor restriction changed during prerequisite setup; blocked.' >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned native Codex without authentication
        run: |
          npm install --prefix "$RUNNER_TEMP/agentgate-codex" --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.154.0
          mapfile -d '' candidates < <(find "$RUNNER_TEMP/agentgate-codex/node_modules/@openai" -type f -name codex -perm -u=x -print0)
          if [[ ${#candidates[@]} != 1 ]]; then
            echo 'Expected exactly one executable native Codex binary.' >&2
            exit 1
          fi
          printf 'AGENTGATE_CODEX_PATH=%s\n' "$(realpath "${candidates[0]}")" >> "$GITHUB_ENV"
      - name: Record the native environment
        run: |
          uname -a
          cat /etc/os-release
          node --version
          "$AGENTGATE_CODEX_PATH" --version
          git rev-parse HEAD
      - name: Verify native filesystem and network isolation without a model
        id: isolation
        run: node test/manual/verify-isolation.ts "$AGENTGATE_CODEX_PATH" | tee "$RUNNER_TEMP/agentgate-isolation.jsonl"
      - name: Verify offline Node and TypeScript checks without a model
        run: node test/manual/verify-toolchain.ts "$AGENTGATE_CODEX_PATH"
      - name: Verify real process cancellation and stale-lock refusal
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: node test/manual/verify-lock-recovery.ts
      - name: Require captured Node child stream compatibility for Linux MVP
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/agentgate-isolation.jsonl" <<'NODE'
          import { readFileSync } from 'node:fs';
          const observations = readFileSync(process.argv[2], 'utf8').trim().split('\n').map(JSON.parse);
          const result = observations.findLast(entry => entry.scope === 'native-filesystem-network-isolation');
          if (result?.result !== 'passed' || result.capturedChildStdioCompatible !== true) {
            console.error('Linux MVP blocked: captured stdin/stdout/stderr of nested Node processes is not verified compatible.');
            process.exitCode = 2;
          } else {
            console.log('Native isolation and captured Node child stream compatibility passed.');
          }
          NODE
