name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Formatting, lint, types, behavior tests, and build
        run: npm run check
      - name: Install and inspect the packaged CLI
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/agentgate-package-smoke" "$RUNNER_TEMP"/agentgate-*.tgz
          node "$RUNNER_TEMP/agentgate-package-smoke/node_modules/agentgate/dist/cli/main.js" --help
          node test/manual/verify-web-package.ts "$RUNNER_TEMP/agentgate-package-smoke/node_modules/agentgate/dist/cli/main.js"
